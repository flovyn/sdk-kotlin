name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin to specific sdk-rust release version
  # Update this when upgrading to a new FFI version
  FFI_VERSION: v0.1.10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download native libraries from sdk-rust release
        run: ./bin/download-ffi.sh ${{ env.FFI_VERSION }} linux-x86_64 linux-aarch64 windows-x86_64

      - name: Check code formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build
        run: ./gradlew build

      - name: Run unit tests
        run: ./gradlew test

  e2e-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    continue-on-error: true # E2E tests can be flaky, don't block the workflow

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download native libraries from sdk-rust release
        run: ./bin/download-ffi.sh ${{ env.FFI_VERSION }} linux-x86_64

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/flovyn
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Pull Flovyn Server image
        run: docker pull rg.fr-par.scw.cloud/flovyn/flovyn-server:latest

      - name: Run E2E tests
        run: ./gradlew :worker-sdk-jackson:e2eTest
        env:
          FLOVYN_SERVER_IMAGE: rg.fr-par.scw.cloud/flovyn/flovyn-server
