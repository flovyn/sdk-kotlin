name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin to specific sdk-rust release version
  # Update this when upgrading to a new FFI version
  FFI_VERSION: v0.1.10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download native libraries from sdk-rust release
        run: ./bin/download-ffi.sh ${{ env.FFI_VERSION }} linux-x86_64 linux-aarch64 windows-x86_64

      - name: Check code formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build
        run: ./gradlew build

      - name: Run unit tests
        run: ./gradlew test

  # E2E tests moved to workspace CI (dev repo)

  trigger-workspace:
    name: Trigger Workspace CI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref_name != 'main'
    steps:
      - name: Check for matching branches
        id: check
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          MATCHING_REPOS=""

          for repo in flovyn-server sdk-rust sdk-python sdk-typescript; do
            if git ls-remote --exit-code --heads "https://github.com/flovyn/$repo" "$BRANCH" 2>/dev/null; then
              MATCHING_REPOS="$MATCHING_REPOS $repo"
            fi
          done

          if [ -n "$MATCHING_REPOS" ]; then
            echo "trigger=true" >> $GITHUB_OUTPUT
            echo "Found matching branches in:$MATCHING_REPOS"
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger workspace CI
        if: steps.check.outputs.trigger == 'true'
        run: |
          gh workflow run integration.yml -R flovyn/dev -f branch="${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_PAT }}
