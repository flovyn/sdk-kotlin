name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  # Pin to specific sdk-rust release version
  FFI_VERSION: v0.1.9

jobs:
  # Publish SNAPSHOT to Maven Central on main branch push
  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate SNAPSHOT version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          if [[ ! "$VERSION" == *"SNAPSHOT"* ]]; then
            echo "Error: Version $VERSION is not a SNAPSHOT version"
            exit 1
          fi
          echo "Publishing version: $VERSION"

      - name: Download native libraries from sdk-rust release
        run: ./bin/download-ffi.sh ${{ env.FFI_VERSION }} linux-x86_64 linux-aarch64 windows-x86_64

      - name: Build
        run: ./gradlew build -x test

      - name: Publish to Maven Central Snapshots
        run: ./gradlew publishMavenPublicationToSnapshotRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # Publish release to Maven Central on version tag
  publish-release:
    name: Publish Release to Maven Central
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # for GitHub Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Download native libraries from sdk-rust release
        run: ./bin/download-ffi.sh ${{ env.FFI_VERSION }} linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64

      - name: Build
        run: ./gradlew build -x test -Pversion=${{ steps.version.outputs.version }}

      - name: Stage artifacts
        run: ./gradlew publishMavenPublicationToStagingRepository -Pversion=${{ steps.version.outputs.version }}

      - name: Deploy to Maven Central
        run: ./gradlew jreleaserDeploy -Pversion=${{ steps.version.outputs.version }}
        env:
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Bump version after successful release (separate job for clean retries)
  bump-version:
    name: Bump to next SNAPSHOT
    needs: publish-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump to next SNAPSHOT version
        run: |
          # Parse current version (e.g., 0.1.0 -> 0.2.0-SNAPSHOT)
          VERSION=${{ steps.version.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"

          # Update gradle.properties
          sed -i "s/^version=.*/version=${NEXT_VERSION}/" gradle.properties

          echo "Bumped version to: $NEXT_VERSION"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to $(grep '^version=' gradle.properties | cut -d'=' -f2)"
          git push origin main
